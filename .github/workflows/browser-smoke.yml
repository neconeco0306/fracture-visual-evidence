name: Browser QA (mobile)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  mobile-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Require patched Node before package downloads
        run: node -e 'if (process.versions.node !== "22.23.4") process.exit(1)'
      - name: Install Playwright test runner (CI only)
        run: npm install --no-save --package-lock=false --no-audit --no-fund @playwright/test@1.56.1
      - name: Install Chromium browser and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Serve static site locally
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/fracture-http.log 2>&1 &
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8000/ >/dev/null && exit 0
            sleep 1
          done
          echo "Local HTTP server failed"
          cat /tmp/fracture-http.log
          exit 1
      - name: Run mobile interaction & actual file-export tests
        shell: bash
        run: |
          set -o pipefail
          npx playwright test tests/browser-smoke.spec.mjs --reporter=line --workers=1 2>&1 | tee /tmp/fracture-browser-qa.log
      - name: Check the actual public GitHub Pages website
        env:
          TEST_BASE_URL: https://neconeco0306.github.io/fracture-visual-evidence
        shell: bash
        run: |
          curl -fsSL --retry 5 --retry-delay 3 "$TEST_BASE_URL/" -o /tmp/fracture-public-index.html
          grep -Fq 'neconeco0306.github.io/fracture-visual-evidence/' /tmp/fracture-public-index.html
          curl -fsSL --retry 5 --retry-delay 3 "$TEST_BASE_URL/contrast.html" -o /tmp/fracture-public-contrast.html
          grep -Fq 'CAN YOU' /tmp/fracture-public-contrast.html
          npx playwright test tests/browser-smoke.spec.mjs --reporter=line --workers=1
      - name: Report synthetic test failure to tracked issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [ -f /tmp/fracture-browser-qa.log ]; then
            {
              printf '## CI diagnostic — run %s\n\n' "$GITHUB_RUN_ID"
              printf 'Synthetic test output only (last 100 lines; no user files).\n\n'
              printf '\`\`\`text\n'
              tail -n 100 /tmp/fracture-browser-qa.log | cut -c1-500
              printf '\`\`\`\n'
            } > /tmp/fracture-browser-comment.md
            gh issue comment 1 --repo "$GITHUB_REPOSITORY" --body-file /tmp/fracture-browser-comment.md
          fi
      - name: Publish failure artifacts for triage
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fracture-browser-qa
          path: test-results/
          if-no-files-found: ignore
